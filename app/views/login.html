<!-- Login View -->
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <i class="fas fa-vault"></i>
      <h1>DocVault</h1>
      <p>Sign in to your document portal</p>
    </div>

    <form ng-submit="vm.login()" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" ng-model="vm.email"
                 placeholder="you@example.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" ng-model="vm.password"
                 placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block"
              ng-disabled="vm.loading">
        <span ng-if="!vm.loading">
          <i class="fas fa-right-to-bracket"></i> Sign In
        </span>
        <span ng-if="vm.loading">
          <div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:8px;"></div>
          Signing in...
        </span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="#!/register">Create one</a>
    </div>
  </div>
</div>
